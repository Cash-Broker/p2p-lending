; PHP upload limits for the KYC document flow (PHP-FPM / FastCGI reads this;
; mod_php ignores it — the equivalent lives in .htaccess for that case).
;
; The KYC validation contract is max:10240 KB per file x 3 files per POST.
; Distro php.ini defaults (2M/8M) silently break every real phone photo:
; per-file overflow -> UPLOAD_ERR_INI_SIZE -> "failed to upload" 422;
; aggregate overflow -> 413 PostTooLargeException.
;
; NOTE: FPM caches this file for user_ini.cache_ttl (default 300s) — changes
; take up to 5 minutes or an FPM reload to apply.
upload_max_filesize = 12M
post_max_size = 40M
